</div></header><section id="fgLogin" style="max-width:440px;margin:30px auto;padding:24px"><h2>Accesso riservato</h2><form id="fgLoginForm" style="display:block"><label>E-mail<input id="fgEmail" type="email" autocomplete="username" required></label><label>Password<input id="fgPassword" type="password" autocomplete="current-password" required></label><label><input id="fgRemember" type="checkbox" checked style="width:auto"> Ricordami</label><button type="submit">Accedi</button></form><p id="fgStatus" role="status"></p></section><main id="fgApp" style="display:none"><button id="fgLogout" class="secondary">Esci</button><p id="notice" class="muted">PROFESSIONAL • collaudo accesso personale • Collaudo archivio online. Esportare regolarmente il backup.</p><nav id="nav"></nav><section id="panel"></section><section id="archive"></section><section class="actions"><button onclick="backup()">Esporta backup JSON</button> <button class="secondary" onclick="document.getElementById('import').click()">Importa backup</button><input hidden type="file" id="import" accept=".json" onchange="restore(this)"> <button class="secondary" onclick="window.print()">Stampa / PDF</button></section></main><script>
const schemas={ 'Ricevimento merci':['Prodotto','Fornitore','Lotto fornitore','Scadenza|date','Quantità e unità','Temperatura rilevata °C|number','Esito|choice','Azione correttiva'], 'Produzione':['Preparazione','Reparto','Lotti ingredienti|lots','Quantità e unità','Scadenza validata|date','Conservazione','Allergeni'], 'Temperature':['Attrezzatura','Temperatura rilevata °C|number','Limite da piano HACCP','Esito|choice','Azione correttiva'], 'Abbattimento':['Preparazione','Lotto interno|production','Tipo ciclo','Ora inizio|time','Temperatura iniziale °C|number','Ora fine|time','Temperatura finale al cuore °C|number','Limite da piano HACCP','Esito|choice','Azione correttiva'], 'Cottura':['Preparazione','Lotto interno|production','Temperatura al cuore °C|number','Tempo mantenimento','Limite da piano HACCP','Esito|choice','Azione correttiva'], 'Sottovuoto':['Prodotto','Lotto interno|production','Conservazione','Scadenza validata|date','Esito|choice','Azione correttiva'], 'Scongelamento':['Prodotto','Lotto origine','Ora inizio|time','Ora fine|time','Temperatura °C|number','Esito|choice','Azione correttiva'], 'Sanificazione':['Reparto','Superficie o attrezzatura','Prodotto utilizzato','Concentrazione e tempo contatto','Esito|choice','Azione correttiva'], 'Allergeni':['Preparazione','Lotto interno|production','Allergeni presenti','Rischio contaminazione crociata','Misure preventive'], 'Non conformità':['Problema','Lotto o attrezzatura','Azione correttiva','Responsabile verifica','Stato'], 'Smaltimento':['Prodotto','Lotto','Quantità e unità','Motivo','Destinazione'], 'Piano controlli':['Controllo','Reparto','Frequenza','Limiti validati','Responsabile'], 'Etichette':[], 'Scadenze':[], 'Archivio':[]};
Object.assign(schemas,{
'Abbattimento positivo':['Lotto interno|production','Inizio|datetime-local','Temperatura iniziale °C|number','Fine|datetime-local','Temperatura finale al cuore °C|number','Limite da piano HACCP','Esito|choice','Azione correttiva','Ubicazione','Scadenza validata|datetime-local','Allergeni'],
'Abbattimento negativo':['Lotto interno|production','Inizio|datetime-local','Temperatura iniziale °C|number','Fine|datetime-local','Temperatura finale al cuore °C|number','Limite da piano HACCP','Esito|choice','Azione correttiva','Ubicazione','Scadenza validata|datetime-local','Allergeni'],
'Conservazione refrigerata':['Lotto interno|production','Ubicazione','Temperatura rilevata °C|number','Scadenza validata|datetime-local','Esito|choice','Azione correttiva'],
'Conservazione congelata':['Lotto interno|production','Ubicazione','Temperatura rilevata °C|number','Scadenza validata|datetime-local','Esito|choice','Azione correttiva'],
'Apertura confezioni':['Prodotto','Lotto origine|origin','Scadenza validata|datetime-local','Ubicazione','Allergeni'],
'Mantenimento caldo':['Lotto interno|production','Temperatura rilevata °C|number','Limite da piano HACCP','Esito|choice','Azione correttiva'],
'Buffet freddi':['Lotto interno|production','Temperatura rilevata °C|number','Inizio|datetime-local','Fine|datetime-local','Limite da piano HACCP','Esito|choice','Azione correttiva'],
'Rigenerazione':['Lotto interno|production','Temperatura al cuore °C|number','Limite da piano HACCP','Esito|choice','Azione correttiva'],
'Oli di frittura':['Friggitrice','Misura e metodo','Limite da piano HACCP','Esito|choice','Azione correttiva'],
'Manutenzione':['Attrezzatura','Intervento','Prossima verifica|date','Esito|choice','Azione correttiva'],
'Infestanti':['Area','Punto monitoraggio','Riscontro','Esito|choice','Azione correttiva'],
'Controllo acqua':['Punto prelievo','Riferimento analisi','Esito|choice','Azione correttiva'],
'Formazione':['Addetto','Argomento','Data formazione|date','Prossima verifica|date'],
'Controllo giornaliero':['Lotto origine|origin','Ubicazione','Integrità e stato etichetta','Temperatura rilevata °C|number','Esito|choice','Azione correttiva']});
schemas.Scongelamento=['Prodotto','Lotto origine|origin','Inizio|datetime-local','Fine|datetime-local','Temperatura °C|number','Scadenza validata|datetime-local','Ubicazione','Esito|choice','Azione correttiva'];
schemas['Registro fatture']=['Fornitore','Numero documento','Tipo documento','Data documento|date','Riferimento allegato'];
schemas['Ricevimento merci']=['Documento|invoice','Prodotto','Fornitore','Lotto fornitore','Scadenza|date','Quantità|number','Unità|unit','Prezzo unitario €|number','Temperatura rilevata °C|number','Esito|choice','Azione correttiva'];
schemas['Ricette e procedure']=['Preparazione','Ingredienti e grammature','Lavorazione','Confezionamento','Abbattimento previsto','Conservazione','Allergeni','Procedura validata','Durata validata ore|number'];
schemas['Magazzino']=[];
const labelModules=['Produzione','Abbattimento positivo','Abbattimento negativo','Conservazione refrigerata','Conservazione congelata','Apertura confezioni','Sottovuoto','Scongelamento'];
let db=[]; let active='Registro fatture';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=()=>new Date().toLocaleDateString('sv-SE');function persist(){window.fgSyncSave?.()}
const units=['kg','g','l','ml','pezzi','confezioni','cartoni'];
function normalizeUnit(u){let v=String(u||'').trim().toLowerCase();return ({lt:'l',litri:'l',litro:'l',pz:'pezzi',pc:'pezzi',pezzo:'pezzi',conf:'confezioni',confezione:'confezioni',cartone:'cartoni',ct:'cartoni'})[v]||v}
function validUnit(u){return units.includes(u)}
function receiptUnit(r){return r.data['Unità']||'kg'}
function receiptQty(r){return Number(r.data['Quantità']??r.data['Quantità kg']??0)}
function receiptPrice(r){return Number(r.data['Prezzo unitario €']??r.data['Prezzo €/kg']??0)}
function factor(a,b){if(a===b)return 1;return ({'kg:g':1000,'g:kg':.001,'l:ml':1000,'ml:l':.001})[a+':'+b]??null}
function priceFor(r,u){let k=factor(u,receiptUnit(r));return k===null?'':receiptPrice(r)*k}

function stock(r){return receiptQty(r)-db.filter(x=>x.module==='Produzione').reduce((a,x)=>a+Number(x.data.prelievi?.[r.id]||0),0)}
function field(spec){let [n,t]=spec.split('|');let h=`<label>${esc(n)}`;if(t==='invoice'){h+=`<select name="${esc(n)}" required><option value="">Seleziona documento</option>${db.filter(r=>r.module==='Registro fatture').map(r=>`<option value="${esc(r.id)}">${esc(r.data.Fornitore)} — ${esc(r.data['Numero documento'])}</option>`).join('')}</select>`}else if(t==='choice')h+=`<select name="${esc(n)}" required><option value="">Seleziona</option><option>Conforme</option><option>Non conforme</option></select>`;else if(t==='lots'||t==='production'||t==='origin'){let rows=db.filter(r=>(t==='origin'?['Ricevimento merci',...labelModules].includes(r.module):r.module===(t==='lots'?'Ricevimento merci':'Produzione')) && r.data.Esito!=='Non conforme');h+=`<select name="${esc(n)}" ${t==='lots'?'multiple size="5"':''} required>${t!=='lots'?'<option value="">Seleziona</option>':''}${rows.map(r=>`<option value="${esc(r.id)}">${esc(r.data.Prodotto||r.data.Preparazione)} — ${esc(r.data['Lotto fornitore']||r.id)} (${esc(r.id)})</option>`).join('')}</select>`;if(!rows.length)h+='<small>Registrare prima il lotto di origine.</small>'}else h+=`<input name="${esc(n)}" type="${t||'text'}" ${t==='number'?'step="any"':''} ${n==='Azione correttiva'?'':'required'}>`;return h+'</label>'}
function productionForm(){let recipes=db.filter(r=>r.module==='Ricette e procedure');let lots=db.filter(r=>r.module==='Ricevimento merci'&&r.data.Esito==='Conforme'&&!expired(r.data.Scadenza)&&stock(r)>0);return `<form id="prod"><label>Operatore<input name="Operatore" required></label><label>Ricetta<select name="recipe" required><option value="">Seleziona</option>${recipes.map(r=>`<option value="${esc(r.id)}">${esc(r.data.Preparazione)}</option>`).join('')}</select></label><label>Reparto<input name="Reparto" required></label><label>Quantità prodotta e unità<input name="Quantità e unità" required></label><label>Ubicazione<input name="Ubicazione" required></label><label>Scadenza validata effettiva<input type="datetime-local" name="Scadenza validata" required></label><div style="grid-column:1/-1" id="recipeInfo"></div><div style="grid-column:1/-1"><b>Prelievi effettivi (unità del lotto)</b>${lots.map(r=>`<label>${esc(r.data.Prodotto)} — ${esc(r.data['Lotto fornitore'])} — residuo ${stock(r).toFixed(3)} ${esc(receiptUnit(r))}<input type="number" min="0" max="${stock(r)}" step="0.001" name="lot_${esc(r.id)}" value="0"></label>`).join('')||'<p>Nessun lotto disponibile.</p>'}</div><button>Registra produzione</button></form>`}
async function saveProd(e){e.preventDefault();let f=new FormData(e.target),r=db.find(x=>x.id===f.get('recipe')),prelievi={},cost=0;if(!r)return;for(let [k,v] of f){if(!k.startsWith('lot_')||!Number(v))continue;let lot=db.find(x=>x.id===k.slice(4)),q=Number(v);if(!lot||q<=0||q>stock(lot)||expired(lot.data.Scadenza)||lot.data.Esito!=='Conforme')return alert('Prelievo non valido');prelievi[lot.id]=q;cost+=q*receiptPrice(lot)}if(!Object.keys(prelievi).length)return alert('Selezionare i lotti effettivi');let expiry=f.get('Scadenza validata');if(expired(expiry)||new Date(expiry)>new Date(Date.now()+Number(r.data['Durata validata ore'])*3600000))return alert('Scadenza non compatibile con la durata configurata');let data={...r.data,Operatore:f.get('Operatore'),Reparto:f.get('Reparto'),'Quantità e unità':f.get('Quantità e unità'),Ubicazione:f.get('Ubicazione'),'Scadenza validata':expiry,'Lotti ingredienti':Object.keys(prelievi).map(id=>db.find(x=>x.id===id).data['Lotto fornitore']+' ('+id+')').join(', '),prelievi,'Costo ingredienti €':cost.toFixed(2),'Stato':'Da verificare: lavorazioni e controlli effettivi'};try {
  await window.fgSaveProduction(r.id, data);
  render();
} catch (error) {
  alert(error.message);
}}
function render(){ $('nav').innerHTML=Object.keys(schemas).map(k=>`<button class="${k===active?'':'secondary'}" onclick="active='${k}';render()">${k}</button>`).join('');let special=['Etichette','Scadenze','Archivio','Magazzino','Produzione'].includes(active);$('panel').innerHTML=`<h2>${active}</h2><p class="muted">${db.length} registrazioni totali • ${db.filter(r=>r.data.Esito==='Non conforme').length} esiti non conformi</p>`+(special?'':`<form id="entry">${field('Operatore')}${schemas[active].map(field).join('')}<button>Registra</button></form>`);if(!special)$('entry').onsubmit=save;if(active==='Produzione'){$('panel').innerHTML+=productionForm();$('prod').onsubmit=saveProd;$('prod').elements.recipe.onchange=e=>{let r=db.find(x=>x.id===e.target.value);$('recipeInfo').textContent=r?Object.entries(r.data).map(([k,v])=>k+': '+v).join(' • '):''}}let rows=active==='Archivio'?db:active==='Etichette'?db.filter(r=>labelModules.includes(r.module)&&r.data.Esito!=='Non conforme'):active==='Scadenze'?db.filter(r=>r.data.Scadenza||r.data['Scadenza validata']).sort((a,b)=>(a.data.Scadenza||a.data['Scadenza validata']).localeCompare(b.data.Scadenza||b.data['Scadenza validata'])):active==='Magazzino'?db.filter(r=>r.module==='Ricevimento merci'):db.filter(r=>r.module===active);$('archive').innerHTML='<h2>'+ (active==='Etichette'?'Etichette di produzione':'Registrazioni')+'</h2>'+(!rows.length?'<p>Nessuna registrazione.</p>':rows.slice().reverse().map(r=>`<div class="record"><b>${esc(r.module)} — ${esc(r.id)}</b><div class="muted">${esc(new Date(r.at).toLocaleString('it-IT'))}</div>${active==='Magazzino'?'<b>Residuo: '+stock(r).toFixed(3)+' kg</b>':''}${Object.entries(r.data).map(([k,v])=>`<div>${esc(k)}: ${esc(typeof v==='object'?JSON.stringify(v):v)}</div>`).join('')}${active==='Scadenze'&&expired(r.data.Scadenza||r.data['Scadenza validata'])?'<b class="warn">Scadenza raggiunta o superata</b>':''}${active==='Etichette'?`<button class="actions" onclick="labelPrint('${r.id}')">Stampa etichetta</button>`:''}</div>`).join(''))}
function expired(v){return v?.length===10?v<=today():new Date(v)<=new Date()}
function save(e){e.preventDefault();let f=new FormData(e.target),data={};for(let k of new Set(f.keys()))data[k]=f.getAll(k).join(', ');if(active==='Ricevimento merci'){let doc=db.find(r=>r.id===data.Documento);if(!doc||doc.data.Fornitore!==data.Fornitore||!validUnit(data['Unità'])||!Number.isFinite(Number(data['Quantità']))||Number(data['Quantità'])<=0||!Number.isFinite(Number(data['Prezzo unitario €']))||Number(data['Prezzo unitario €'])<0)return alert('Verificare documento, fornitore, quantità e prezzo')}if(active==='Movimenti magazzino'){let lot=db.find(r=>r.id===data.Lotto);if(!lot)return alert('Lotto mancante');data['Unità']=receiptUnit(lot)}if(active==='Ricette e procedure'&&Number(data['Durata validata ore'])<=0)return alert('Durata non valida');if(data.Esito==='Non conforme'&&!data['Azione correttiva']){alert('Indicare azione correttiva');return}if(data.Inizio&&data.Fine&&data.Fine<data.Inizio){alert('Fine precedente all’inizio');return}if(data['Scadenza validata']&&expired(data['Scadenza validata'])){alert('Scadenza già raggiunta: verificare prima di registrare');return}let id='FG-'+today().replaceAll('-','')+'-'+(globalThis.crypto?.randomUUID?.()||Math.random().toString(36).slice(2)).slice(0,8);db.push({id,module:active,at:new Date().toISOString(),data});persist();render()}
function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='GENCHI_HACCP_backup_'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function restore(i){try{let x=JSON.parse(await i.files[0].text());if(!Array.isArray(x)||!x.every(r=>typeof r.id==='string'&&typeof r.at==='string'&&Object.hasOwn(schemas,r.module)&&r.data&&typeof r.data==='object'))throw Error();if(confirm('Unire il backup alle registrazioni presenti?')){let ids=new Set(db.map(r=>r.id));for(let r of x)if(!ids.has(r.id)){db.push(r);ids.add(r.id)}persist();render()}}catch(e){alert('Backup non valido')}i.value=''}function labelPrint(id){let r=db.find(x=>x.id===id),origin=db.find(x=>x.id===(r.data['Lotto interno']||r.data['Lotto origine'])),d=r.data,o=origin?.data||{},expiry=d['Scadenza validata']||o['Scadenza validata'];if(r.module==='Produzione'&&d.Stato){alert('Registrare prima i controlli effettivi di lavorazione e conservazione');return}if(!expiry||expired(expiry)||d.Esito==='Non conforme'){alert('Etichetta operativa bloccata: scadenza assente o raggiunta, oppure non conformità.');return}let w=window.open('','_blank');if(!w){alert('Consentire apertura finestra per stampare');return}w.document.write('<html><title>Etichetta</title><body style="font:16px system-ui"><h2>GENCHI HACCP</h2><h3>'+esc(d.Preparazione||d.Prodotto||o.Preparazione||o.Prodotto||'Preparazione')+'</h3>'+Object.entries({'Lotto interno / registrazione':r.id,'Lotto origine':origin?.id||r.id,'Trattamento':r.module,'Registrazione':new Date(r.at).toLocaleString('it-IT'),'Scadenza validata':expiry,'Ubicazione / conservazione':d.Ubicazione||d.Conservazione||o.Conservazione,'Allergeni':d.Allergeni||o.Allergeni||'Da verificare','Operatore':d.Operatore}).map(([k,v])=>'<p>'+esc(k)+': '+esc(v)+'</p>').join('')+'</body></html>');w.document.close();w.print()}

const locations=['Cella carni','Cella pesce','Cella formaggi e latticini','Cella salumi','Cella ortofrutta','Cella prodotti cotti','Cella semilavorati','Cella pasticceria','Congelatore carne','Congelatore pesce','Congelatore preparazioni','Magazzino alimenti secchi','Magazzino bevande','Magazzino non alimentare'];
const categories=['Uova e ovoprodotti','Spezie e aromi','Carni','Pesce e molluschi','Formaggi e latticini','Salumi','Ortofrutta','Pasticceria','Preparazioni','Alimenti secchi','Bevande','Non alimentare','Altro'];
schemas['Ricevimento merci'].splice(3,0,'Categoria|category','Stato fisico|physical','Ubicazione|location');
schemas['Attrezzature']=['Nome attrezzatura','Tipo|equipment','Limiti validati','Frequenza controlli'];
schemas['Movimenti magazzino']=['Lotto|stocklot','Operazione|movement','Quantità|number','Destinazione|location','Motivo'];
function places(){return [...new Set([...locations,...db.filter(r=>r.module==='Attrezzature'&&!/Abbattitore/.test(r.data.Tipo)).map(r=>r.data['Nome attrezzatura'])])]}
function selectField(n,options){return `<label>${esc(n)}<select name="${esc(n)}" required><option value="">Seleziona</option>${options.map(x=>`<option>${esc(x)}</option>`).join('')}</select></label>`}
const oldField=field; field=function(spec){let [n,t]=spec.split('|');if(t==='unit')return selectField(n,units);if(t==='category')return selectField(n,categories);if(t==='physical')return selectField(n,['Fresco/refrigerato','Congelato','Secco/ambiente']);if(t==='location')return selectField(n,places());if(t==='equipment')return selectField(n,['Cella positiva','Congelatore negativo','Magazzino ambiente','Abbattitore positivo','Abbattitore negativo']);if(t==='movement')return selectField(n,['Consumo diretto','Scarto','Trasferimento']);if(t==='stocklot')return `<label>Lotto<select name="Lotto" required><option value="">Seleziona</option>${db.filter(r=>r.module==='Ricevimento merci'&&stock(r)>0).map(r=>`<option value="${esc(r.id)}">${esc(r.data.Prodotto)} — ${esc(r.data['Lotto fornitore'])} — ${stock(r).toFixed(3)} ${esc(receiptUnit(r))}</option>`).join('')}</select></label>`;return oldField(spec)};

function calculator(){return `<h2>Calcolatore unico delle produzioni</h2><p class="muted">Le quantità sono teoriche; confermare sempre i prelievi reali.</p><label>Porzioni base<input id="basePort" type="number" min="1" max="1000" value="10"></label><label>Porzioni richieste<input id="targetPort" type="number" min="1" max="1000" value="20"></label><label>Ingredienti: una riga per ingrediente, nome; quantità; unità; prezzo per unità (facoltativo)<textarea id="calcLines" rows="6" placeholder="Polpo; 2; kg; 12.50"></textarea></label><button onclick="calculateShared()">Calcola</button><div id="calcResult"></div>`}
function calculateShared() {
  const base = Number($('basePort').value);
  const richieste = Number($('targetPort').value);
  if (!Number.isInteger(base) || !Number.isInteger(richieste) ||
      base < 1 || richieste < 1 || base > 1000 || richieste > 1000) {
    return alert('Porzioni da 1 a 1000');
  }

  const risultato = $('calcResult');
  const densitaInserite = new Map(
    [...risultato.querySelectorAll('[data-densita]')].map(input => [input.dataset.densita, input.value])
  );
  const righe = $('calcLines').value.trim().split('\n').filter(riga => riga.trim()).map((riga, i) => {
    const [nome, q, unita, p] = riga.split(';').map(valore => valore.trim());
    const quantita = Number(q?.replace(',', '.'));
    const prezzo = Number(p?.replace(',', '.'));
    if (!nome || !unita || !Number.isFinite(quantita) || quantita <= 0) {
      throw Error('Verificare ingredienti e quantità');
    }
    const dose = quantita * richieste / base;
    const costo = p && Number.isFinite(prezzo) && prezzo >= 0 ? dose * prezzo : null;
    const unitaNormalizzata = normalizeUnit(unita);
    return { nome, dose, unita, unitaNormalizzata, costo, chiave: i + '|' + nome + '|' + unitaNormalizzata };
  });

  const totale = righe.reduce((somma, riga) => somma + (riga.costo ?? 0), 0);
  const parziale = righe.some(riga => riga.costo === null);
  risultato.innerHTML = righe.map(({ nome, dose, unita, costo }) =>
    `<div class="record"><b>${esc(nome)}</b> · ${dose.toFixed(3)} ${esc(unita)}${costo === null ? '' : ' · € ' + costo.toFixed(2)}</div>`
  ).join('') + `<p><b>${parziale ? 'Costo parziale' : 'Costo totale'}: € ${totale.toFixed(2)}</b></p>`;

  const liquidi = righe.filter(riga => riga.unitaNormalizzata === 'ml' || riga.unitaNormalizzata === 'l');
  if (!liquidi.length) return;

  const sezione = document.createElement('section');
  sezione.innerHTML = '<h3>Conversione liquidi in grammi</h3><p class="muted">Usa la densità indicata dal produttore oppure pesa 100 ml al netto del contenitore e dividi i grammi per 100.</p>';
  const formato = new Intl.NumberFormat('it-IT', { maximumFractionDigits: 2 });
  for (const { nome, dose, unitaNormalizzata, chiave } of liquidi) {
    const scheda = document.createElement('div');
    scheda.className = 'record';
    scheda.innerHTML = `<b>${esc(nome)}</b><br>
      <label>Densità indicativa o misurata (g/ml)<input type="text" inputmode="decimal" maxlength="12" placeholder="Es. 0,92" autocomplete="off"></label>
      <output aria-live="polite"></output>`;
    const input = scheda.querySelector('input');
    const peso = scheda.querySelector('output');
    const ml = unitaNormalizzata === 'l' ? dose * 1000 : dose;
    const nomeNormalizzato = nome.trim().toLowerCase().replace(/\s+/g, ' ');
    const acqua = ['acqua', 'acqua naturale', 'acqua potabile', 'acqua minerale'].includes(nomeNormalizzato);
    const olio = /^(olio evo|olio extra vergine di oliva|olio extra vergine d['’]oliva|olio extravergine di oliva|olio extravergine d['’]oliva|olio di oliva|olio d['’]oliva)$/.test(nomeNormalizzato);
    input.dataset.densita = chiave;
    input.value = densitaInserite.get(chiave) ?? (acqua ? '1' : olio ? '0,92' : '');

    function aggiornaPeso() {
      const valore = input.value.trim();
      const densita = Number(valore.replace(',', '.'));
      const grammi = ml * densita;
      const valida = /^(?:\d+(?:[.,]\d+)?|[.,]\d+)$/.test(valore) &&
        densita > 0 && Number.isFinite(grammi);
      input.setAttribute('aria-invalid', String(Boolean(valore) && !valida));
      const volume = formato.format(ml) + ' ml';
      peso.textContent = valida ? volume + ' ≈ ' + formato.format(grammi) + ' g'
        : volume + (valore ? ' · Inserisci una densità positiva.' : ' · Inserisci la densità per vedere i grammi.');
    }

    input.addEventListener('input', aggiornaPeso);
    aggiornaPeso();
    sezione.append(scheda);
  }
  risultato.append(sezione);
}

function recipeLines(r){return String(r.data['Ingredienti e grammature']||'').split('\n').filter(x=>x.trim()).map(x=>{let [n,q,u]=x.split(';').map(y=>y.trim());let v=Number((q||'').replace(',','.'));if(!n||!Number.isFinite(v)||v<=0||!validUnit(u))throw Error('Formato ingredienti: nome; quantità; kg, g, l, ml, pezzi, confezioni o cartoni');return {n,q:v,u}})}
function scaled(r,target){let base=Number(r.data['Porzioni base']||1);if(!Number.isInteger(target)||target<1||target>1000||!Number.isInteger(base)||base<1||base>1000)throw Error('Porzioni da 1 a 1000');return recipeLines(r).map(x=>({...x,q:x.q*target/base}))}

function loadShared(){let r=db.find(x=>x.id===$('sharedRecipe').value);if(!r)return;$('basePort').value=r.data['Porzioni base']||1;$('calcLines').value=recipeLines(r).map(x=>{let lot=inventory().find(y=>status(y)!=='BLOCCATO'&&y.data.Prodotto.toLowerCase()===x.n.toLowerCase()&&factor(x.u,receiptUnit(y))!==null);let price=lot?priceFor(lot,x.u):'';return [x.n,x.q,x.u,price].join('; ')}).join('\n')}
function proposePicks(){try{let f=$('prod'),r=db.find(x=>x.id===f.elements.recipe.value);if(!r)throw Error('Seleziona ricetta');let lines=scaled(r,Number($('prodPort').value)),inputs=[...f.querySelectorAll('input[name^="lot_"]')];inputs.forEach(i=>i.value=0);let missing=[];for(let x of lines){let left=x.q;for(let i of inputs){let lot=db.find(y=>y.id===i.name.slice(4));if(lot.data.Prodotto.toLowerCase().trim()!==x.n.toLowerCase().trim())continue;let k=factor(x.u,receiptUnit(lot));if(k===null)continue;let q=Math.floor(Math.min(left*k,Math.max(0,stock(lot)-Number(i.value)))*1000+1e-8)/1000;i.value=(Number(i.value)+q).toFixed(3);left-=q/k;if(left<.0005)break}if(left>.0005)missing.push(x.n+': '+left.toFixed(3)+' '+x.u+' mancanti')} $('pickNotice').textContent=missing.length?missing.join(' · '):(inputs.filter(i=>Number(i.value)>0).map(i=>{const lot=db.find(y=>y.id===i.name.slice(4));return lot.data.Prodotto+' — lotto '+lot.data['Lotto fornitore']+' — prelievo '+Number(i.value).toFixed(3)+' '+receiptUnit(lot)+' — residuo previsto '+(stock(lot)-Number(i.value)).toFixed(3)+' '+receiptUnit(lot)+' — costo € '+(Number(i.value)*receiptPrice(lot)).toFixed(2)}).join(' · ')||'Nessun prelievo calcolato')+' · Verificare i lotti fisici. Nessun movimento registrato.'}catch(e){alert(e.message)}}

function fishAndBaseClass(n){let s=n.toLowerCase();let sub=/polp|seppi|calamar|totan/.test(s)?'Cefalopodi':/gamber|scamp|astice|aragost|granch/.test(s)?'Crostacei':/cozz|vongol|ostric|capasant/.test(s)?'Bivalvi':/caviale|uova di pesce/.test(s)?'Uova e caviale':/lumach|muric/.test(s)?'Gasteropodi':/trota|carpa|persico/.test(s)?'Pesce di acqua dolce':/tonno|orata|spigola|merluzz|salmone|pesce/.test(s)?'Pesce di mare':'';return {cat:sub?'Pesce e molluschi':classify(s),sub,state:/surgel/.test(s)?'Surgelato':/congel/.test(s)?'Congelato':/fresc|refriger/.test(s)?'Fresco/refrigerato':/affumic/.test(s)?'Affumicato':''}}
function smartClass(n){let c=fishAndBaseClass(n),s=n.toLowerCase();if(c.sub)return c;let rules=[[/zafferano|pepe|paprika|curcuma|cannella|noce moscata|spezie|origano/,'Spezie e aromi','Spezie e aromi','Secco/ambiente'],[/\buov[ao]\b|albume|tuorlo/,'Uova e ovoprodotti','Uova e ovoprodotti',''],[/latte/,'Formaggi e latticini','Latte',''],[/panna/,'Formaggi e latticini','Panna',''],[/burro/,'Formaggi e latticini','Burro',''],[/mozzarella|burrata|ricotta|formaggio|parmigiano/,'Formaggi e latticini','Formaggi',''],[/farina|semola|amido/,'Alimenti secchi','Farine e amidi','Secco/ambiente'],[/pasta|riso|couscous/,'Alimenti secchi','Pasta e cereali',''],[/olio|aceto/,'Alimenti secchi','Oli e condimenti','Secco/ambiente'],[/zucchero|miele|sale/,'Alimenti secchi','Zuccheri e condimenti','Secco/ambiente'],[/cioccolato|cacao/,'Pasticceria','Cioccolato e cacao',''],[/lievito|gelatina|pectina/,'Pasticceria','Ingredienti tecnici',''],[/acqua minerale|vino|birra|succo/,'Bevande','Bevande',''],[/manzo|vitello/,'Carni','Bovini',''],[/pollo|tacchino/,'Carni','Avicoli',''],[/maiale/,'Carni','Suini',''],[/agnello/,'Carni','Ovini',''],[/prosciutto|salame|mortadella|bresaola/,'Salumi','Salumi e affettati',''],[/patat|carot|zucchin|pomodor|insalata/,'Ortofrutta','Ortaggi',''],[/mela|pera|fragol|limon|aranci/,'Ortofrutta','Frutta','']];let r=rules.find(x=>x[0].test(s));if(r){c.cat=r[1];c.sub=r[2];c.state=c.state||r[3]}if(/\buht\b|lunga conservazione/.test(s)&&c.cat==='Formaggi e latticini')c.state='Secco/ambiente';return c}
function smartDestination(c,state){let f={elements:{Categoria:{value:c},'Stato fisico':{value:state==='Surgelato'?'Congelato':state},Ubicazione:{value:''}}};if(!c||!state||c==='Altro')return '';suggest(f);return places().includes(f.elements.Ubicazione.value)?f.elements.Ubicazione.value:''}

function smartView(){ $('nav').innerHTML='<button onclick="home()">Cartelle principali</button>'; $('archive').innerHTML='';$('panel').innerHTML=`<h2>GENCHI SMART SCAN</h2><p>Acquisizione documenti. Completa i controlli evidenziati e conferma il carico.</p><label>Fattura elettronica XML<input type="file" accept=".xml,text/xml,application/xml" onchange="smartXML(this)"></label><label>Fotografia DDT / fattura<input type="file" accept="image/*" capture="environment" onchange="smartPhoto(this)"></label><p id="smartStatus"></p><label>Fornitore<input id="smartSupplier"></label><label>Numero documento<input id="smartNumber"></label><label>Data documento<input type="date" id="smartDate"></label><label>Righe riconosciute (prodotto; quantità; unità; prezzo unitario)<textarea id="smartText" rows="8"></textarea></label><button onclick="smartPreview()">Classifica prodotti</button><div id="smartRows"></div><p>Anteprima: registrazione massiva non ancora abilitata. Verificare quantità, lotti, scadenze e temperature.</p>`}
async function smartXML(i){try{let d=new DOMParser().parseFromString(await i.files[0].text(),'application/xml');if(d.querySelector('parsererror'))throw Error('XML non valido');let get=(x,n)=>x?.getElementsByTagNameNS('*',n)[0]?.textContent||'';let supplier=d.getElementsByTagNameNS('*','CedentePrestatore')[0],doc=d.getElementsByTagNameNS('*','DatiGeneraliDocumento')[0];$('smartSupplier').value=get(supplier,'Denominazione')||[get(supplier,'Nome'),get(supplier,'Cognome')].join(' ').trim();$('smartNumber').value=get(doc,'Numero');$('smartDate').value=get(doc,'Data');$('smartText').value=[...d.getElementsByTagNameNS('*','DettaglioLinee')].map(r=>['Descrizione','Quantita','UnitaMisura','PrezzoUnitario'].map(k=>get(r,k)).join('; ')).join('\n');smartPreview()}catch(e){$('smartStatus').textContent=e.message}}
async function smartPhoto(i){const f=i.files[0];if(!f)return;const status=$('smartStatus');if(f.size>15000000){status.textContent='Immagine troppo grande (massimo 15 MB).';return}i.disabled=true;let worker;try{status.textContent='Riconoscimento fotografico in corso…';if(!window.Tesseract){await new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';script.onload=resolve;script.onerror=reject;document.head.append(script)})}worker=await Tesseract.createWorker('ita+eng',1,{logger:m=>{if(m.status==='recognizing text')status.textContent='Lettura '+Math.round(m.progress*100)+'%'}});const result=await worker.recognize(f);if(!status.isConnected)return;const raw=result.data.text;const area=document.createElement('textarea');area.readOnly=true;area.rows=10;area.value=raw;const label=document.createElement('label');label.textContent='Testo OCR originale — verificare con documento';label.append(area);document.getElementById('fgOcrRaw')?.remove();label.id='fgOcrRaw';status.after(label);const rows=[];for(const line of raw.split(/\r?\n/)){const m=line.trim().match(/^(.+?)\s+(\d+(?:[.,]\d+)?)\s+(kg|g|l|ml|pz|pezzi)\s+(?:€\s*)?(\d+[.,]\d{2})\s*$/i);if(m)rows.push([m[1],m[2].replace(',','.'),m[3].toLowerCase()==='pz'?'pezzi':m[3].toLowerCase(),m[4].replace(',','.')].join('; '))}if(rows.length&&!$('smartText').value.trim()){$('smartText').value=rows.join('\n');smartPreview()}status.textContent='OCR completato. '+rows.length+' righe candidate. Verificare documento, quantità, prezzi, lotti e temperature. Nessun carico automatico.'}catch(e){status.textContent='Lettura OCR non riuscita. Nessun dato registrato.'}finally{if(worker)await worker.terminate();i.disabled=false}}
function smartPreview(){let rows=$('smartText').value.split('\n').filter(x=>x.trim()).map(x=>{let [n,q,u,p]=x.split(';').map(y=>y.trim());let c=smartClass(n);return `<div class="record"><b>${esc(n)}</b><br>${esc(q)} ${esc(u||'Unità da verificare')} · € ${esc(p||'Da verificare')}<br>${esc(c.cat||'Categoria da verificare')} → ${esc(c.sub||'Sottocategoria da verificare')}<br>Stato: ${esc(c.state||'Da verificare')}</div>`});$('smartRows').innerHTML=rows.join('')||'Nessuna riga riconosciuta';}
