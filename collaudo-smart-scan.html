<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Collaudo SMART SCAN</title><style>body{font:1.1rem system-ui;margin:1rem auto;padding:0 1rem;max-width:40rem;color:#153a30;background:#f5f7f5}label{display:block;margin:1rem 0}input,textarea,button{display:block;box-sizing:border-box;width:100%;font:inherit;padding:.65rem;margin-top:.4rem}button{background:#153a30;color:white;border:0;border-radius:.4rem}.smart-photo-controls{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:.5rem}.smart-photo-controls input{width:100%;min-width:0;margin:0}.smart-photo-controls button{width:auto;white-space:nowrap;margin:0;padding:.55rem;min-height:44px}</style><main id="panel"><h1>Collaudo SMART SCAN</h1><p>Usa una foto di prova. La lettura avviene nel browser e questa pagina non registra carichi.</p><label for="smartPhotoFile">Foto di fattura o DDT</label><div class="smart-photo-controls"><input id="smartPhotoFile" type="file" accept="image/*" onchange="smartPhoto(this)"><button type="button" onclick="smartClearDraft()">Cancella foto</button></div><p id="smartStatus" role="status"></p><label>Fornitore<input id="smartSupplier"></label><label>Numero documento<input id="smartNumber"></label><label>Data documento<input type="date" id="smartDate"></label><label>Righe riconosciute<textarea id="smartText" rows="6"></textarea></label><p id="smartRows"></p></main><script>const $=id=>document.getElementById(id);
function smartPreview(){ $('smartRows').textContent=$('smartText').value.trim()?'Controlla le righe proposte con il documento.':''; }
function smartOcrDraft(raw){
  const lines=raw.split(/\r?\n/).map(line=>line.trim());
  function unique(pattern){
    const values=[...new Set(lines.map(line=>line.match(pattern)?.[1]).filter(Boolean))];
    return values.length===1?values[0]:'';
  }
  const supplier=unique(/^(?:fornitore|cedente)\s*:\s*(.+)$/i);
  const number=unique(/^(?:fattura|ddt|numero documento)\s*(?:n[.°]?\s*)?:?\s+([\w/-]*\d[\w/-]*)$/i);
  const [day,month,year]=unique(/^data(?:\s+(?:documento|fattura|ddt|emissione))?\s*[: ]\s*(\d{1,2}[./-]\d{1,2}[./-]\d{4})$/i).split(/[./-]/);
  const iso=year?[year,month.padStart(2,'0'),day.padStart(2,'0')].join('-'):'';
  const parsed=new Date(iso);
  const date=Number.isFinite(+parsed)&&parsed.toISOString().slice(0,10)===iso?iso:'';
  const rows=[];
  const decimal=value=>value.replace(',','.');
  for(const line of lines){
    if(/^(?:totale|subtotale|imponibile|iva|saldo|lotto|scadenza)\b/i.test(line))continue;
    const fields=line.match(/^(.+?)\s+(?:(\d+(?:[.,]\d+)?)\s+(kg|g|l|ml|pz|pezzi)|(kg|g|l|ml|pz|pezzi)\s+(\d+(?:[.,]\d+)?))\s+(?:€\s*)?(\d+[.,]\d{2,4})(?:\s+(?:€\s*)?(\d+[.,]\d{2})(?:\s+\d{1,2}\s*%)?)?$/i);
    if(!fields)continue;
    const [,name,q,u,reversedUnit,reversedQty,price,total]=fields;
    const quantity=decimal(q||reversedQty), unit=(u||reversedUnit).toLowerCase();
    if(!/\p{L}/u.test(name)||name.includes(';')||+quantity<=0)continue;
    if(total&&Math.abs(+quantity*+decimal(price)-+decimal(total))>0.00501)continue;
    rows.push([name,quantity,unit==='pz'?'pezzi':unit,decimal(price)].join('; '));
  }
  return {supplier,number,date,rows};
}
function smartClearDraft(){
  for(const id of ['smartSupplier','smartNumber','smartDate','smartText'])$(id).value='';
  $('panel').querySelectorAll('input[type="file"]').forEach(input=>{input.value='';input.disabled=false});
  document.getElementById('fgOcrRaw')?.remove();
  $('smartRows').replaceChildren();
  $('smartStatus').textContent='Bozza cancellata.';
}
async function smartPhoto(i){const f=i.files[0];if(!f)return;const status=$('smartStatus');const active=()=>status.isConnected&&i.files[0]===f;if(f.size>15000000){status.textContent='Immagine troppo grande (massimo 15 MB).';return}i.disabled=true;let worker;try{status.textContent='Riconoscimento fotografico in corso…';if(!window.Tesseract){await new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';script.onload=resolve;script.onerror=reject;document.head.append(script)})}worker=await Tesseract.createWorker('ita+eng',1,{logger:m=>{if(active()&&m.status==='recognizing text')status.textContent='Lettura '+Math.round(m.progress*100)+'%'}});if(!active())return;const result=await worker.recognize(f);if(!active())return;const raw=result.data.text;const area=document.createElement('textarea');area.readOnly=true;area.rows=10;area.value=raw;const label=document.createElement('label');label.textContent='Testo OCR originale — verificare con documento';label.append(area);document.getElementById('fgOcrRaw')?.remove();label.id='fgOcrRaw';status.after(label);const draft=smartOcrDraft(raw);for(const [id,value] of [['smartSupplier',draft.supplier],['smartNumber',draft.number],['smartDate',draft.date]]){const field=$(id);if(value&&!field.value.trim())field.value=value}const rows=draft.rows;if(rows.length&&!$('smartText').value.trim()){$('smartText').value=rows.join('\n');smartPreview()}status.textContent='OCR completato. '+rows.length+' righe candidate. Verificare documento, quantità, prezzi, lotti e temperature. Nessun carico automatico.'}catch(e){if(active())status.textContent='Lettura OCR non riuscita. Nessun dato registrato.'}finally{if(active())i.disabled=false;if(worker)await worker.terminate().catch(()=>{})}}
</script></html>
